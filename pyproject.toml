[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-slim"
version = "1.0.0"
description = "Cross-agent token and context budget skill + CLI tools for pentesting, code auditing, and development"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cslim = "scripts.cslim:main"

[tool.setuptools]
packages = ["scripts"]

[project.urls]
Homepage = "https://github.com/DaoYiSec/ContextSlim"
Repository = "https://github.com/DaoYiSec/ContextSlim.git"
